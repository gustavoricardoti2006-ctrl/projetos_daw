
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserir usuario</title>
</head>

<body>
    <form>
        nome: <input type="text" name="nome" id="nome"><br>
        email: <input type="text" name="email" id="email"><br>
        senha: <input type="text" name="senha" id="senha"><br>
        <input type="submit" value="enviar" onclick="enviarCalculo()">
    </form>

    <br><a href="lista_usuarios.php">voltar a lista</a>
</body>

<script>
        function enviarCalculo() {

            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;

            let xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {

                if (xhr.readyState == 4 && xhr.status == 200) {

                    if (xhr.responseText.trim() == "sucesso") {
                        window.location.href = "lista_usuarios.php";
                    } else {
                        alert(xhr.responseText);
                    }

                }
            };

            let url = "inserir_usuario.php?nome=" + encodeURIComponent(nome) +
                "&email=" + encodeURIComponent(email) +
                "&senha=" + encodeURIComponent(senha);

            xhr.open("GET", url, true);
            xhr.send();
        }
    </script>

</html>
