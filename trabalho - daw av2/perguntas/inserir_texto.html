
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova pergunta</title>
</head>

<body>
    <form>

        Pergunta: <input type="text" id="pergunta"><br>
        Resposta correta: <input type="text" id="correta"><br>

        <input type="submit" value="enviar" onclick="enviarCalculo()">

    </form>

    <a href="lista_perguntas.php">voltar a lista</a>

    <script>
        function enviarCalculo() {

            let pergunta = document.getElementById("pergunta").value;
            let resposta = document.getElementById("correta").value;

            let xhr = new XMLHttpRequest();

            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    if (xhr.responseText.trim() == "sucesso") {
                        window.location.href = "lista_perguntas.php";
                    } else {
                        alert(xhr.responseText);
                    }
                }
            };

            let url = "inserir_texto.php?pergunta=" + encodeURIComponent(pergunta) +
             "&resposta=" + encodeURIComponent(resposta);

            xhr.open("GET", url, true);
            xhr.send();
        }
    </script>

</body>
</html>
