<script>

    function enviarCalculo() {

        let pergunta = document.getElementById("pergunta").value;
        let a = document.getElementById("a").value;
        let b = document.getElementById("b").value;
        let c = document.getElementById("c").value;
        let d = document.getElementById("d").value;
        let resposta = document.getElementById("correta").value;

        let xhr = new XMLHttpRequest();

        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                if (xhr.responseText.trim() == "sucesso") {
                    window.location.href = "lista_perguntas.php";
                } else {
                    alert(xhr.responseText);
                }
            }
        };

        let url = "inserir_multipla.php?pergunta=" + encodeURIComponent(pergunta) +
            "&a=" + encodeURIComponent(a) +
            "&b=" + encodeURIComponent(b) +
            "&c=" + encodeURIComponent(c) +
            "&d=" + encodeURIComponent(d) +
            "&correta=" + encodeURIComponent(resposta);

        xhr.open("GET", url, true);
        xhr.send();

    }

</script>
